schema_version = "1.0.0"

id = "ageha2"
version = "0.3.1"
name = "揚羽"
tagline = "All-in-one hair grooming and Kami4 CUDA simulation"
maintainer = "Y Tsukamoto"
type = "add-on"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
tags = ["Physics"]
platforms = ["windows-x64"]

[permissions]
files = "髪のシミュレーションキャッシュの読み書きと Kami4 CUDA DLL の読込"

[build]
paths = [
    "__init__.py",
    "ui.py",
    "blender_io.py",
    "_mask_plant.py",
    "_groom_ops.py",
    "kami4_solver/__init__.py",
    "kami4_solver/addon.py",
    "kami4_solver/cache.py",
    "kami4_solver/native.py",
    "kami4_solver/parameters.json",
    "kami4_solver/README.md",
    "kami4_solver/LICENSE",
    "kami4_solver/blender_manifest.toml",
    "kami4_solver/bin/kami4_hair_core.dll",
    "README.md",
    "LICENSE",
    "LICENSE-AGEHA-MIT",
    "THIRD_PARTY_NOTICES.md",
]
